name: CI

on: [push, pull_request]

defaults:
  run:
    working-directory: client-master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client-master/package-lock.json
      - run: npm ci
      - run: npm run build-prod
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client-master/package-lock.json
      - run: npm ci
      - run: npm test
  lint:
    runs-on: ubuntu-latest
    # The existing code base still has lint errors; report them without blocking the beta.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client-master/package-lock.json
      - run: npm ci
      - run: npx eslint
