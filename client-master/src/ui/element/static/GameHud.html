<ignore>
	<link rel="stylesheet" type="text/css" href="../../../../resources/themes/pastel.css">
</ignore>

<div id="GameHudContainer" class="layout-window background-vignette">
	<aside id="leaderboard" class="leaderboard">
		<button id="leaderboardToggle" class="leaderboard-header" type="button" aria-expanded="true" aria-controls="leaderboardContent">
			<span id="leaderboardTitle"></span>
			<span class="leaderboard-chevron" aria-hidden="true"></span>
		</button>
		<div id="leaderboardContent" class="leaderboard-content">
			<div id="leaderboardViewport" class="leaderboard-viewport" tabindex="0">
				<ol id="leaderboardRows" class="leaderboard-rows"></ol>
			</div>
		</div>
	</aside>

	<aside id="resourcePanel" class="resource-panel ui-passive">
		<div class="resource-frame">
			<div class="resource-body">
				<div class="resource-main">
					<span id="resourceTroops" class="resource-troops">0</span>
					<span id="resourceRate" class="resource-rate">(+0.00/tick)</span>
				</div>
				<div class="resource-stats">
					<div class="resource-stat">
						<span class="resource-stat-icon resource-icon-players" aria-hidden="true"></span>
						<span id="resourcePlayers" class="resource-stat-value">0</span>
						<span id="resourcePlayersLabel" class="resource-stat-label"></span>
					</div>
					<div class="resource-stat">
						<span class="resource-stat-icon resource-icon-map" aria-hidden="true"></span>
						<span id="resourceMap" class="resource-stat-value">0%</span>
						<span id="resourceMapLabel" class="resource-stat-label"></span>
					</div>
					<div class="resource-stat">
						<span class="resource-stat-icon resource-icon-interest" aria-hidden="true"></span>
						<span id="resourceInterest" class="resource-stat-value">0%</span>
						<span id="resourceInterestLabel" class="resource-stat-label"></span>
					</div>
				</div>
			</div>
		</div>
	</aside>

	<div id="spawnTimer" class="spawn-timer ui-passive" role="progressbar" aria-labelledby="spawnTimerLabel" aria-valuemin="0" aria-valuemax="30" aria-valuenow="0" hidden>
		<span id="spawnTimerLabel" class="spawn-timer-label">Spawning</span>
		<div class="spawn-timer-bar">
			<div class="spawn-timer-line"></div>
			<div class="spawn-timer-well"></div>
			<div class="spawn-timer-core"></div>
			<div class="spawn-timer-fill"></div>
			<span id="spawnTimerTime" class="spawn-timer-time">30s</span>
		</div>
	</div>

	<div class="anchor-bottom-right hud-buttons flex-row grid-gap-m ui-passive p-1_2">
		<span id="gameClock" class="hud-clock">00:00:00</span>
		<button id="openSettings" class="btn btn-circle btn-primary icon-m icon-settings"></button>
		<button id="exitGame" class="btn btn-circle btn-danger icon-m icon-quit"></button>
	</div>

	<div id="selectorContainer" class="anchor-bottom-center ui-passive selector-container">
		<button id="selectorMinus" class="selector-step selector-step-minus" type="button" aria-label="Decrease attack strength"></button>
		<label id="sliderAttackStrength" class="selector-slider">
			<span class="selector-text">
				<span id="selectorTroopCount" class="selector-troops">0</span>
				<span id="sliderAttackNumber" class="selector-number">(50%)</span>
			</span>
			<input id="sliderAttackHidden" type="range" min="0" max="100" step="any" aria-label="Attack strength">
		</label>
		<button id="selectorPlus" class="selector-step selector-step-plus" type="button" aria-label="Increase attack strength"></button>
	</div>
</div>
